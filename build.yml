
name: Build kOS Desktop Appon:  push:    branches:      - main  pull_request:    branches:      - mainjobs:  release:    runs-on: ${{ matrix.os }}    strategy:      matrix:        os: [ubuntu-latest, windows-latest, macos-latest]    steps:      - name: Check out Git repository        uses: actions/checkout@v3      - name: Install Node.js and NPM        uses: actions/setup-node@v3        with:          node-version: 18          cache: 'npm'      - name: Install dependencies        run: npm install      - name: Build and Package Desktop App        run: npm run dist        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
