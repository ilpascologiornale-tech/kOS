<!DOCTYPE html>
<html lang="it">
<head>

    <!-- SCRIPT LOGICA OPERATIVA (kOS CORE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURAZIONE ED INIZIALIZZAZIONE CLOUD (FIRESTORE)
        const firebaseConfig = {
            apiKey: "", // Gestito a runtime dall'ambiente
            authDomain: "kos-retro.firebaseapp.com",
            projectId: "kos-retro",
            storageBucket: "kos-retro.appspot.com",
            messagingSenderId: "123456789",
            appId: typeof __app_id !== 'undefined' ? __app_id : 'kOS-app-id'
        };

        // Fallback robusto se config non caricata
        let db = null;
        let auth = null;
        let currentUser = null;
        let nickname = "Utente_" + Math.floor(1000 + Math.random() * 9000);

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            
            // Accesso anonimo automatico per collaborazione in tempo reale
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    console.log("kOS Cloud Autenticato con UID:", user.uid);
                    setupChatListener();
                }
            });
        } catch (e) {
            console.warn("Utilizzo del database locale offline. I messaggi saranno simulati.");
        }

        // Variabili Globali Sistema con supporto a file personali pre-caricati e nuove directory di tipo
        window.activeWindows = [];
        window.focusedWindow = null;
        window.fileSystem = {
            "Documenti": {
                "benvenuto.txt": "Benvenuto in kOS! Un sistema operativo web in grado di navigare, scrivere presentazioni, giocare ed interagire in tempo reale.",
                "appunti.txt": "Cose da fare oggi:\n- Provare KExplorer\n- Vincere a Prato Fiorito\n- Chiacchierare su kMessenger con altri utenti online.\n- Caricare file .mp3, .mp4, .png e altro con il pulsante 'Carica File'!"
            },
            "Fogli_di_Calcolo": {
                "bilancio.kcalc": "Prodotto,Vendite,Prezzo\nkOS Pro,120,49\nKExplorer,500,0"
            },
            "Presentazioni": {
                "kos_intro.kslide": JSON.stringify([
                    { title: "kOS Operating System", text: "L'era moderna incontra l'estetica leggendaria." },
                    { title: "Il Nostro Messaggero", text: "Chatta in tempo reale con tutti utilizzando kMessenger." }
                ])
            },
            "Immagini": {
                "Valle di Montagna": "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&auto=format&fit=crop",
                "Prati al crepuscolo": "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&auto=format&fit=crop",
                "Sentiero nella Foresta": "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=800&auto=format&fit=crop"
            },
            "Media": {} // Spazio dedicato a tracce audio (.mp3, .wav) o video (.mp4, .webm) caricati dall'utente
        };

        // AUDIO SYNTHESIZER (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        window.playClassicBeep = function(frequency, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration/1000);
                osc.stop(audioCtx.currentTime + duration/1000);
            } catch (e) {}
        }

        window.playXpStartup = function() {
            // Suono armonicamente ispirato all'avvio classico
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    playClassicBeep(freq, 800 - idx * 100);
                }, idx * 120);
            });
        }

        // FUNZIONE DI UPLOAD GLOBALE MULTIMEDIALE
        window.triggerFileInput = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            // Accetta file di testo, immagini, audio e video
            input.accept = ".txt,.png,.jpg,.jpeg,.gif,.mp3,.wav,.mp4,.webm";
            
            input.onchange = (e) => {
                const files = e.target.files;
                if (!files.length) return;
                
                let loadedCount = 0;
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    const ext = file.name.split('.').pop().toLowerCase();
                    
                    if (['png', 'jpg', 'jpeg', 'gif'].includes(ext)) {
                        reader.onload = function(evt) {
                            window.fileSystem.Immagini[file.name] = evt.target.result;
                            fileProcessed();
                        };
                        reader.readAsDataURL(file);
                    } else if (['mp3', 'wav', 'mp4', 'webm'].includes(ext)) {
                        reader.onload = function(evt) {
                            window.fileSystem.Media[file.name] = evt.target.result;
                            fileProcessed();
                        };
                        reader.readAsDataURL(file);
                    } else if (ext === 'txt') {
                        reader.onload = function(evt) {
                            window.fileSystem.Documenti[file.name] = evt.target.result;
                            fileProcessed();
                        };
                        reader.readAsText(file);
                    } else {
                        // Trattamento generico come documento testuale
                        reader.onload = function(evt) {
                            window.fileSystem.Documenti[file.name] = evt.target.result;
                            fileProcessed();
                        };
                        reader.readAsText(file);
                    }
                });

                function fileProcessed() {
                    loadedCount++;
                    if (loadedCount === files.length) {
                        showNotification("Importazione File", `Caricati con successo ${files.length} file nel sistema!`);
                        playClassicBeep(700, 150);
                        // Forza il refresh delle schermate aperte per visualizzare subito i nuovi file
                        refreshWindowContents();
                    }
                }
            };
            input.click();
        }

        // Funzione per aggiornare le app attive che visualizzano file
        function refreshWindowContents() {
            activeWindows.forEach(win => {
                const container = document.querySelector(`#${win.id} .flex-1`);
                if (container) {
                    if (win.appType === 'kFiles' || win.appType === 'kPhotos' || win.appType === 'kMusic') {
                        // Svuota e ricarica i contenuti dell'applicazione
                        container.innerHTML = '';
                        injectAppContent(win.appType, container, win.id);
                    }
                }
            });
        }

        // OROLOGIO E SYSTEM UTILITIES
        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('system-clock').textContent = `${hrs}:${mins}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // AVVIO DI SISTEMA
        window.addEventListener('load', () => {
            playXpStartup();
            document.getElementById('username-display').innerText = nickname;
            showNotification("Benvenuto in kOS!", "Il sistema è pronto. Fai clic su 'Carica File' per importare la tua musica, immagini o video.");
        });

        // MENU START CONTROLS
        window.toggleStartMenu = function() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('hidden');
            playClassicBeep(600, 50);
        }

        // CHIUSURA START MENU AL CLICK FUORI
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('start-menu');
            const startBtn = document.getElementById('start-btn');
            if (!menu.contains(e.target) && !startBtn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // APERTURA APP DA START
        window.openAndCloseStart = function(appId) {
            document.getElementById('start-menu').classList.add('hidden');
            openApp(appId);
        }

        // GESTORE FINESTRE (APRI / CHIUDI / DRAG & DROP / RESIZE)
        window.openApp = function(appType) {
            // Se l'app è già aperta, portala in primo piano
            const existing = activeWindows.find(w => w.appType === appType);
            if (existing) {
                focusWindow(existing.id);
                return;
            }

            const id = 'win-' + Math.floor(Math.random() * 100000);
            const titles = {
                kMessenger: 'kMessenger - Messaggistica Istantanea',
                KExplorer: 'KExplorer Web Browser',
                kPad: 'kPad Text Editor',
                kCalc: 'kCalc - Foglio di Calcolo',
                kSlide: 'kSlide Presentations',
                kTerminal: 'Prompt dei Comandi kOS',
                kPhotos: 'Galleria Foto / Immagini',
                kMusic: 'kPlayer Retro & Video Player',
                kFiles: 'Esplora Risorse',
                minesweeper: 'Prato Fiorito (Minesweeper)'
            };

            const width = Math.min(window.innerWidth - 40, 700);
            const height = 480;
            const x = 50 + (activeWindows.length * 30);
            const y = 50 + (activeWindows.length * 20);

            const newWin = {
                id,
                title: titles[appType] || appType,
                appType,
                x,
                y,
                width,
                height,
                isMinimized: false,
                isMaximized: false
            };

            activeWindows.push(newWin);
            renderWindow(newWin);
            focusWindow(id);
            updateTaskbar();
            playClassicBeep(520, 80);
        }

        window.closeWindow = function(id) {
            activeWindows = activeWindows.filter(w => w.id !== id);
            const el = document.getElementById(id);
            if (el) el.remove();
            updateTaskbar();
            playClassicBeep(300, 100);
        }

        window.minimizeWindow = function(id) {
            const win = activeWindows.find(w => w.id === id);
            if (win) {
                win.isMinimized = true;
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            }
            updateTaskbar();
        }

        window.maximizeWindow = function(id) {
            const win = activeWindows.find(w => w.id === id);
            if (win) {
                win.isMaximized = !win.isMaximized;
                const el = document.getElementById(id);
                if (el) {
                    if (win.isMaximized) {
                        el.style.top = '0';
                        el.style.left = '0';
                        el.style.width = '100vw';
                        el.style.height = 'calc(100vh - 40px)';
                    } else {
                        el.style.top = `${win.y}px`;
                        el.style.left = `${win.x}px`;
                        el.style.width = `${win.width}px`;
                        el.style.height = `${win.height}px`;
                    }
                }
            }
        }

        window.focusWindow = function(id) {
            activeWindows.forEach(w => {
                const el = document.getElementById(w.id);
                if (el) {
                    if (w.id === id) {
                        el.style.zIndex = '30';
                        el.classList.remove('opacity-90');
                        el.classList.remove('hidden');
                        w.isMinimized = false;
                    } else {
                        el.style.zIndex = '20';
                        el.classList.add('opacity-90');
                    }
                }
            });
            focusedWindow = id;
            updateTaskbar();
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-windows');
            container.innerHTML = '';
            activeWindows.forEach(w => {
                const isFocused = focusedWindow === w.id;
                const btn = document.createElement('button');
                btn.className = `h-8 px-3 rounded text-white text-xs font-semibold flex items-center gap-1 border border-blue-400 active:opacity-95 ${isFocused ? 'bg-blue-800 shadow-inner' : 'bg-blue-600 hover:bg-blue-500'}`;
                btn.onclick = () => {
                    if (w.isMinimized || !isFocused) {
                        focusWindow(w.id);
                    } else {
                        minimizeWindow(w.id);
                    }
                };
                
                // Icona dell'app
                let iconClass = 'fa-window-maximize';
                if (w.appType === 'kMessenger') iconClass = 'fa-comments';
                if (w.appType === 'KExplorer') iconClass = 'fa-compass';
                if (w.appType === 'kPad') iconClass = 'fa-file-lines';
                if (w.appType === 'kCalc') iconClass = 'fa-table-cells';
                if (w.appType === 'kSlide') iconClass = 'fa-file-powerpoint';
                if (w.appType === 'kTerminal') iconClass = 'fa-terminal';
                if (w.appType === 'kPhotos') iconClass = 'fa-image';
                if (w.appType === 'kMusic') iconClass = 'fa-circle-play';
                if (w.appType === 'kFiles') iconClass = 'fa-folder';
                if (w.appType === 'minesweeper') iconClass = 'fa-bomb';

                btn.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span class="max-w-[120px] truncate">${w.title}</span>`;
                container.appendChild(btn);
            });
        }

        // GENERAZIONE E RENDERING DELLE FINESTRE
        function renderWindow(win) {
            const winEl = document.createElement('div');
            winEl.id = win.id;
            winEl.className = "absolute bg-[#d4d0c8] retro-bevel flex flex-col shadow-2xl pointer-events-auto rounded-t-md overflow-hidden select-text";
            winEl.style.width = `${win.width}px`;
            winEl.style.height = `${win.height}px`;
            winEl.style.left = `${win.x}px`;
            winEl.style.top = `${win.y}px`;
            winEl.style.zIndex = '30';

            // Costruiamo la barra del titolo stile XP
            const titleBar = document.createElement('div');
            titleBar.className = "xp-window-header text-white flex justify-between items-center px-2 py-1 cursor-move select-none";
            titleBar.innerHTML = `
                <div class="flex items-center gap-1.5 font-bold text-sm tracking-wide w-[80%] truncate">
                    <img src="kOS.png" alt="" class="h-4 w-4" onerror="this.onerror=null; this.outerHTML='<i class=\'fa-solid fa-window-restore\'></i>';">
                    <span>${win.title}</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="minimizeWindow('${win.id}')" class="bg-blue-600 text-white w-5 h-5 flex items-center justify-center font-bold border border-blue-400 hover:bg-blue-500 rounded text-xs">-</button>
                    <button onclick="maximizeWindow('${win.id}')" class="bg-blue-600 text-white w-5 h-5 flex items-center justify-center font-bold border border-blue-400 hover:bg-blue-500 rounded text-xs">▢</button>
                    <button onclick="closeWindow('${win.id}')" class="bg-red-500 text-white w-5 h-5 flex items-center justify-center font-bold border border-red-400 hover:bg-red-600 rounded text-xs">X</button>
                </div>
            `;

            // Drag & Drop
            let isDragging = false;
            let offset = { x: 0, y: 0 };
            titleBar.addEventListener('mousedown', (e) => {
                if (win.isMaximized) return;
                // Impedisci l'attivazione del drag se clicco sui pulsanti della barra
                if (e.target.closest('button')) return;
                isDragging = true;
                offset.x = e.clientX - winEl.offsetLeft;
                offset.y = e.clientY - winEl.offsetTop;
                focusWindow(win.id);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.x = e.clientX - offset.x;
                win.y = e.clientY - offset.y;
                winEl.style.left = `${win.x}px`;
                winEl.style.top = `${win.y}px`;
            });
            document.addEventListener('mouseup', () => { isDragging = false; });

            // Touch Support per Drag & Drop
            titleBar.addEventListener('touchstart', (e) => {
                if (win.isMaximized) return;
                if (e.target.closest('button')) return;
                isDragging = true;
                const touch = e.touches[0];
                offset.x = touch.clientX - winEl.offsetLeft;
                offset.y = touch.clientY - winEl.offsetTop;
                focusWindow(win.id);
            });
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                win.x = touch.clientX - offset.x;
                win.y = touch.clientY - offset.y;
                winEl.style.left = `${win.x}px`;
                winEl.style.top = `${win.y}px`;
            });
            document.addEventListener('touchend', () => { isDragging = false; });

            // Contenuto della Finestra
            const contentContainer = document.createElement('div');
            contentContainer.className = "flex-1 flex flex-col p-1 overflow-auto bg-[#d4d0c8]";
            contentContainer.style.height = "calc(100% - 28px)";

            // Inject dell'interfaccia specifica dell'app
            injectAppContent(win.appType, contentContainer, win.id);

            winEl.appendChild(titleBar);
            winEl.appendChild(contentContainer);
            document.getElementById('windows-container').appendChild(winEl);

            // Click focus listener
            winEl.addEventListener('mousedown', () => {
                focusWindow(win.id);
            });
        }

                let slides = JSON.parse(window.fileSystem.Presentazioni["kos_intro.kslide"]);

                const slideList = container.querySelector('#slide-list');

                function renderSlides() {
                    slideList.innerHTML = '';
                    slides.forEach((s, idx) => {

                        thumb.className = `border p-1 text-center cursor-pointer text-[10px] truncate ${idx === currentIdx ? 'bg-blue-200 border-blue-500' : 'bg-slate-50'}`;

            else if (appType === 'minesweeper') {

                    <div class="flex flex-col items-center h-full bg-[#d4d0c8] p-3 text-zinc-900 select-none">
                        <!-- Header Prato Fiorito -->
                        <div class="flex justify-between items-center bg-zinc-300 border-2 border-inset p-1.5 w-full max-w-[240px] mb-3 text-xs font-mono font-bold">

                            <button id="mine-reset" class="bg-yellow-300 border border-zinc-500 px-2 py-0.5 text-base">😊</button>
                            <span id="mine-timer" class="text-red-600 bg-black px-1.5 py-0.5 text-sm">000</span>
                        </div>
                        <!-- Tabella di gioco -->
                        <div id="mine-grid" class="grid grid-cols-9 gap-1 bg-zinc-400 p-1 border-2 border-inset max-w-[240px]"></div>

                const gridContainer = container.querySelector('#mine-grid');
                const resetBtn = container.querySelector('#mine-reset');
                const mineCountEl = container.querySelector('#mine-count');
                const timerEl = container.querySelector('#mine-timer');

                let size = 9;
                let mines = 10;
                let grid = [];
                let minePositions = [];
                let gameActive = true;
                let timer = 0;
                let timerInterval = null;

                function initMinesweeper() {
                    gridContainer.innerHTML = '';
                    grid = Array(size).fill(null).map(() => Array(size).fill(null).map(() => ({ mine: false, revealed: false, flagged: false, count: 0 })));
                    minePositions = [];
                    gameActive = true;
                    clearInterval(timerInterval);
                    timer = 0;
                    timerEl.textContent = '000';
                    mineCountEl.textContent = String(mines).padStart(3, '0');
                    resetBtn.textContent = '😊';

                    // Piazza mine randomicamente
                    let placed = 0;
                    while (placed < mines) {
                        const r = Math.floor(Math.random() * size);
                        const c = Math.floor(Math.random() * size);
                        if (!grid[r][c].mine) {
                            grid[r][c].mine = true;
                            minePositions.push([r, c]);
                            placed++;
                        }
                    }

                    // Calcola vicini
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            if (grid[r][c].mine) continue;
                            let count = 0;
                            for (let dr = -1; dr <= 1; dr++) {
                                for (let dc = -1; dc <= 1; dc++) {
                                    if (grid[r + dr]?.[c + dc]?.mine) count++;
                                }
                            }
                            grid[r][c].count = count;
                        }
                    }

                    // Renderizza i pulsanti delle celle
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            const cellBtn = document.createElement('button');
                            cellBtn.className = "w-6 h-6 bg-zinc-300 border-t-2 border-l-2 border-white border-r-2 border-b-2 border-zinc-600 font-bold flex items-center justify-center text-xs active:border-1";
                            cellBtn.dataset.r = r;
                            cellBtn.dataset.c = c;

                            cellBtn.onclick = () => revealCell(r, c);
                            cellBtn.oncontextmenu = (e) => {
                                e.preventDefault();
                                toggleFlag(r, c);
                            };

                            gridContainer.appendChild(cellBtn);
                        }
                    }

                    // Inizia timer
                    timerInterval = setInterval(() => {
                        timer++;
                        timerEl.textContent = String(timer).padStart(3, '0');
                    }, 1000);
                }

                function revealCell(r, c) {
                    if (!gameActive || grid[r][c].revealed || grid[r][c].flagged) return;

                    grid[r][c].revealed = true;
                    const btn = gridContainer.children[r * size + c];
                    btn.className = "w-6 h-6 bg-zinc-200 border border-zinc-400 font-bold flex items-center justify-center text-xs";

                    if (grid[r][c].mine) {
                        // Esplosione! Gioco perso.
                        gameActive = false;
                        clearInterval(timerInterval);
                        resetBtn.textContent = '😵';
                        revealAllMines();
                        playClassicBeep(150, 400);
                        return;
                    }

                    if (grid[r][c].count > 0) {
                        btn.textContent = grid[r][c].count;
                        // Colori dei numeri storici di Windows
                        const colors = ['text-blue-600', 'text-green-700', 'text-red-600', 'text-indigo-900', 'text-red-900'];
                        btn.classList.add(colors[grid[r][c].count - 1] || 'text-black');
                    } else {
                        // Cascata ricorsiva se zero mine vicine
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (grid[r + dr]?.[c + dc]) revealCell(r + dr, c + dc);
                            }
                        }
                    }

                    checkWin();
                }

                function toggleFlag(r, c) {
                    if (!gameActive || grid[r][c].revealed) return;
                    grid[r][c].flagged = !grid[r][c].flagged;
                    const btn = gridContainer.children[r * size + c];
                    btn.innerHTML = grid[r][c].flagged ? '<i class="fa-solid fa-flag text-red-600"></i>' : '';
                }

                function revealAllMines() {
                    minePositions.forEach(([r, c]) => {
                        const btn = gridContainer.children[r * size + c];
                        btn.className = "w-6 h-6 bg-red-400 border border-zinc-400 flex items-center justify-center text-xs";
                        btn.innerHTML = '<i class="fa-solid fa-bomb text-zinc-900"></i>';
                    });
                }

                function checkWin() {
                    let win = true;
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            if (!grid[r][c].mine && !grid[r][c].revealed) win = false;
                        }
                    }
                    if (win) {
                        gameActive = false;
                        clearInterval(timerInterval);
                        resetBtn.textContent = '😎';
                        showNotification("Prato Fiorito", "Hai vinto! Ottimo lavoro, genio delle mine.");
                        playClassicBeep(880, 500);
                    }
                }

                resetBtn.onclick = initMinesweeper;
                initMinesweeper();
            }
        }

        // BROWSER GEMINI NAVIGATOR (KExplorer Proxy AI)
        async function fetchGeminiBrowsing(queryText) {
            const apiKey = ""; // Gestito automaticamente a runtime
            const systemPrompt = "Sei KExplorer, un browser ultra-veloce degli anni 2000. Traduci la ricerca o l'URL richiesto in una bellissima, completa e dettagliata pagina web interattiva, formattata in perfetto HTML. Mostra dati reali ed informazioni storiche/attuali formattandole piacevolmente. Usa elementi simulati in HTML con Tailwind. NON includere meta tag e non restituire testo grezzo al di fuori di un contenitore HTML pulito.";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Simula e renderizza il sito o la ricerca per: "${queryText}"` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        tools: [{ "google_search": {} }] // Forniamo grounding di Google Search reale!
                    })
                });

                const result = await response.json();
                let text = result.candidates?.[0]?.content?.parts?.[0]?.text || "Errore nel caricamento del sito.";
                
                // Pulizia blocco codice markdown se presente
                if (text.includes("```html")) {
                    text = text.split("```html")[1].split("```")[0];
                } else if (text.includes("```")) {
                    text = text.split("```")[1].split("```")[0];
                }
                return text;
            } catch (err) {
                return `<div class="p-4 text-red-500">Impossibile contattare il server KExplorer. Assicurati che le chiavi API siano attive. Errore: ${err.message}</div>`;
            }
        }

        // GESTORE CHAT FIRESTORE IN TEMPO REALE
        function setupChatListener() {
            if (!db) return;
            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

            onSnapshot(collectionRef, (snapshot) => {
                const messages = [];
                snapshot.forEach(doc => messages.push(doc.data()));
                
                // Ordina per timestamp
                messages.sort((a, b) => a.timestamp - b.timestamp);

                if (window.chatMessagesEl) {
                    window.chatMessagesEl.innerHTML = '';
                    messages.forEach(msg => {
                        // Filtro per destinatario (Tutti o me stesso come destinatario/mittente)
                        if (msg.recipient === "Tutti" || msg.recipient === nickname || msg.sender === nickname) {
                            renderLocalMessage(msg);
                        }
                    });
                    window.chatMessagesEl.scrollTop = window.chatMessagesEl.scrollHeight;
                }
            }, (err) => {
                console.warn("Impossibile caricare messaggi da Firestore:", err);
            });
        }

        function renderLocalMessage(msg) {
            if (!window.chatMessagesEl) return;
            const msgEl = document.createElement('div');
            const isMe = msg.sender === nickname;
            const isPrivate = msg.recipient !== "Tutti";

            msgEl.className = `p-1 px-2 rounded max-w-[80%] text-xs ${isMe ? 'bg-blue-100 self-end ml-auto' : 'bg-slate-200 self-start'} ${isPrivate ? 'border-l-4 border-yellow-500' : ''}`;
            
            const labelDest = isPrivate ? ` <span class="text-yellow-600 font-bold">(Privato a ${msg.recipient})</span>` : '';
            msgEl.innerHTML = `
                <div class="font-bold text-[10px] text-zinc-500">${msg.sender}${labelDest}</div>
                <div>${msg.text}</div>
            `;
            window.chatMessagesEl.appendChild(msgEl);
            window.chatMessagesEl.scrollTop = window.chatMessagesEl.scrollHeight;
        }

        // CHAT BOT DI INTELLIGENZA ARTIFICIALE (Per simulare risposte se l'utente è solo)
        async function triggerBotResponse(userText, recipient, containerEl) {
            if (recipient !== "Tutti" && recipient !== "kOS" && recipient !== "Assistente") return;

            setTimeout(async () => {
                const botTyping = document.createElement('div');
                botTyping.className = "text-zinc-400 italic text-xs";
                botTyping.id = "bot-typing";
                botTyping.textContent = "kOS sta scrivendo...";
                containerEl.appendChild(botTyping);
                containerEl.scrollTop = containerEl.scrollHeight;

                const apiKey = "";
                const systemPrompt = "Sei l'Assistente virtuale integrato nel sistema operativo fittizio kOS. Rispondi con tono simpatico, entusiasta, nostalgico dell'era tecnologica di Windows XP. Sii conciso e amichevole.";
                
                let reply = "Ciao! Sto risistemando i circuiti. KExplorer è incredibile vero?";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const result = await response.json();
                    reply = result.candidates?.[0]?.content?.parts?.[0]?.text || reply;
                } catch (e) {}

                botTyping.remove();

                const botMsg = {
                    sender: recipient === "Tutti" ? "Saggio_kOS" : recipient,
                    recipient: nickname,
                    text: reply,
                    timestamp: Date.now()
                };

                if (db) {
                    try {
                        const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                        await addDoc(collectionRef, botMsg);
                    } catch (e) {
                        renderLocalMessage(botMsg);
                    }
                } else {
                    renderLocalMessage(botMsg);
                }
            }, 1500);
        }

        // UTILITY DI PERSONALIZZAZIONE (SFONDO / UTENTE)
        window.changeWallpaperDialog = function() {
            const url = prompt("Inserisci l'URL di un'immagine online per lo sfondo del desktop:", "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600");
            if (url) {
                document.getElementById('bliss-wallpaper').firstElementChild.style.background = `url('${url}') center/cover no-repeat`;
                showNotification("Sfondo Desktop", "Nuovo sfondo impostato correttamente!");
            }
        }

        window.setNicknameDialog = function() {
            const nick = prompt("Scegli il tuo nuovo Nickname per kOS Cloud Chat:", nickname);
            if (nick) {
                nickname = nick;
                document.getElementById('username-display').innerText = nick;
                showNotification("Profilo di Sistema", `Il tuo nickname è stato impostato su: ${nick}`);
            }
        }

        // NOTIFICHE MODALI CUSTOM (NO ALERTS BLOCCHI IFRAME)
        window.showNotification = function(title, msg) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = msg;
            document.getElementById('custom-alert').classList.remove('hidden');
            playClassicBeep(600, 150);
        }

        window.closeAlert = function() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        window.triggerShutdown = function() {
            document.body.innerHTML = `
                <div class="w-screen h-screen bg-black flex flex-col items-center justify-center text-zinc-600 font-mono text-center">
                    <div class="text-red-600 text-3xl mb-4"><i class="fa-solid fa-power-off"></i></div>
                    <div class="text-lg font-bold">Ora è possibile spegnere il computer in sicurezza.</div>
                    <button onclick="location.reload()" class="mt-6 border border-zinc-700 px-4 py-2 hover:bg-zinc-900 rounded text-sm text-zinc-400">Riavvia kOS</button>
                </div>
            `;
            playClassicBeep(220, 500);
        }
    </script>
